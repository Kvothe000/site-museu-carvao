<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Site oficial do Museu Estadual do Carvão. Conheça a história da mineração no Rio Grande do Sul, visite a antiga Usina Termelétrica e explore nosso acervo histórico.">
    <meta name="keywords" content="Museu do Carvão, Arquivo Histórico...">
    <meta name="author" content="Museu Estadual do Carvão">
    <meta name="robots" content="index, follow">

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Museu Estadual do Carvão">
    <meta property="og:description" content="Conheça a história da mineração no Rio Grande do Sul, visite a antiga Usina Termelétrica e explore nosso acervo histórico.">
    <meta property="og:image" content="img/og-image.jpg">
    <meta property="og:url" content="https://museudocarvao.rs.gov.br/">
    <meta property="og:type" content="website">

    <!-- Twitter Cards Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Museu Estadual do Carvão">
    <meta name="twitter:description" content="Conheça a história da mineração no Rio Grande do Sul, visite a antiga Usina Termelétrica e explore nosso acervo histórico.">
    <meta name="twitter:image" content="img/og-image.jpg">

    <!-- PWA Manifest & Theme -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f0a84d">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300..800&display=swap"
        rel="stylesheet">

    <!-- CDNs Otimizados -->
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js" as="script">
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">

    <script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js" defer></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/premium.css">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></noscript>
    <link rel="icon" href="img/logo-museu.png" type="image/png">
    <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css"></noscript>

</head>

<body>
    <a href="#main-content" class="skip-link">Pular para o Conteúdo Principal</a>

    <header id="main-header">
        <load src="./header.html" />
    </header>

    <main id="main-content">
        <section id="home-carousel" class="splide fade-in-up" aria-label="Imagens do Museu do Carvão">
            <div class="hero-overlay-text">
                <h1>Museu Estadual do Carvão</h1>
            </div>
            <div class="splide__track">
                <ul class="splide__list">
                    <li class="splide__slide">
                        <img src="img/fachada_museu.jpg" alt="Fachada histórica do Museu Estadual do Carvão" loading="eager">
                    </li>
                    <li class="splide__slide">
                        <img src="img/museu_exposicao.jpg" alt="Exposição interna do Museu" loading="lazy" decoding="async">
                    </li>
                    <li class="splide__slide">
                        <img src="img/usina_antiga.jpg" alt="Antiga Usina Termelétrica" loading="lazy" decoding="async">
                    </li>
                </ul>
            </div>
        </section>
        <section class="featured-sections fade-in-up">
            <a href="nossos-fundos.html" class="feature-card">
                <div class="card-content">
                    <h3 data-i18n="nav_collection">Nosso Acervo</h3>
                </div>
            </a>
            <a href="projetos.html" class="feature-card">
                <div class="card-content">
                    <h3 data-i18n="nav_projects">Projetos</h3>
                </div>
            </a>
            <a href="nossa-historia.html" class="feature-card">
                <div class="card-content">
                    <h3 data-i18n="nav_history">Nossa História</h3>
                </div>
            </a>
        </section>
        <section class="home-hero fade-in-up">
            <div class="hero-content">
                <h2 data-i18n="home_visit_title">Planeje sua Visita</h2>
                <p data-i18n="home_visit_desc">Conheça de perto nosso acervo e as instalações históricas da antiga usina
                    termelétrica.</p>
                <a href="localizacao-contato.html" class="hero-button" data-i18n="hero_button">Explore o Acervo</a>
            </div>
        </section>
    </main>

    <footer id="main-footer" class="site-footer">
        <load src="./footer.html" />
    </footer>

    <!-- Widget de Acessibilidade -->
    <div id="ac-widget-container">
        <div class="ac-panel" id="ac-panel-menu">
            <button class="icon-button ac-btn" id="btn-decrease" aria-label="Diminuir Fonte" title="Diminuir Fonte">
                <i class="fa-solid fa-minus" aria-hidden="true"></i>
            </button>
            <button class="icon-button ac-btn" id="btn-original" aria-label="Restaurar Fonte" title="Restaurar Fonte">
                <i class="fa-solid fa-text-height" aria-hidden="true"></i>
            </button>
            <button class="icon-button ac-btn" id="btn-increase" aria-label="Aumentar Fonte" title="Aumentar Fonte">
                <i class="fa-solid fa-plus" aria-hidden="true"></i>
            </button>
            <button class="icon-button ac-btn" id="btn-theme" aria-label="Modo Escuro" title="Modo Escuro">
                <i class="fa-solid fa-moon" aria-hidden="true"></i>
            </button>
            <button class="icon-button ac-btn" id="btn-contrast" aria-label="Alto Contraste" title="Alto Contraste">
                <i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i>
            </button>
        </div>
        <button class="ac-fab" id="btn-ac-toggle" aria-label="Abrir Menu de Acessibilidade">
            <i class="fa-solid fa-universal-access" aria-hidden="true"></i>
        </button>
    </div>

    <script src="js/translations.js"></script>
    <script type="module" src="js/main.js"></script>
</body>

</html>
