<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore fotos históricas e documentos digitalizados no Acervo Digital do Museu Estadual do Carvão.">
    <title>Acervo Digital - Museu Estadual do Carvão</title>

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Acervo Digital - Museu Estadual do Carvão">
    <meta property="og:description" content="Explore fotos históricas e documentos digitalizados no Acervo Digital do Museu Estadual do Carvão.">
    <meta property="og:image" content="https://kvothe000.github.io/site-museu-carvao/img/fachada_museu.jpg">
    <meta property="og:url" content="https://kvothe000.github.io/site-museu-carvao/arquivos-digitais.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Museu Estadual do Carvão">

    <!-- Twitter Cards Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Acervo Digital - Museu Estadual do Carvão">
    <meta name="twitter:description" content="Explore fotos históricas e documentos digitalizados no Acervo Digital do Museu Estadual do Carvão.">
    <meta name="twitter:image" content="https://kvothe000.github.io/site-museu-carvao/img/fachada_museu.jpg">
    <link rel="icon" href="img/logo-museu.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/premium.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="digitais-page">
    <a href="#main-content" class="skip-link">Pular para o Conteúdo Principal</a>

    <header id="main-header">
        <load src="./header.html" />
    </header>

    <main id="main-content">
        <section class="page-title fade-in-up">
            <h1 data-i18n="nav_digital_archive">Arquivos Digitais</h1>
        </section>

        <div class="digitais-layout fade-in-up">
            <!-- Coluna Esquerda: Master -->
            <aside class="sidebar-nav" data-i18n-aria="ad_sidebar_aria" aria-label="Lista de Fundos Documentais">
                <h2 data-i18n="ad_sidebar_title">Fundos Digitais</h2>
                <ul class="fundo-list" id="fundo-list-container">
                    <!-- Gerado dinamicamente via JS -->
                </ul>
            </aside>

            <!-- Coluna Direita: Detail -->
            <section class="detail-section" id="detail-area" aria-live="polite">
                <!-- Gerado dinamicamente via JS (Tela de Boas-vindas por padrão) -->
            </section>
        </div>
    </main>

    <!-- Modal Lightbox para visualização de imagem em tamanho grande -->
    <div id="lightbox-modal" class="lightbox-modal" role="dialog" aria-modal="true" data-i18n-aria="lightbox_aria" aria-label="Visualizador de Imagem">
        <div class="lightbox-content">
            <a id="lightbox-download" class="lightbox-download" download data-i18n-aria="lightbox_download_aria" aria-label="Baixar imagem"><i class="fa-solid fa-download"></i></a>
            <button id="lightbox-close" class="lightbox-close" data-i18n-aria="lightbox_close_aria" aria-label="Fechar visualizador"><i class="fa-solid fa-xmark"></i></button>
            <img id="lightbox-image" src="" alt="">
            <div id="lightbox-caption" class="lightbox-caption"></div>
        </div>
    </div>

    <footer id="main-footer" class="site-footer">
        <load src="./footer.html" />
    </footer>

    <!-- Scripts da Plataforma -->
    <script src="js/translations.js" defer></script>
    <script type="module" src="js/arquivos-digitais.js"></script>
    <script type="module" src="js/main.js"></script>
</body>

</html>
